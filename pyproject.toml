[project]
name = "kestra-mcp"
version = "0.1.0"
description = "MCP server for Kestra, generated from Kestra's own OpenAPI spec"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
kestra-mcp = "kestra_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
